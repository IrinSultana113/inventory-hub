default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  host: 127.0.0.1
  port: 5432
  username: postgres
  database: inventory_hub_development

test:
  <<: *default
  host: 127.0.0.1
  port: 5432
  username: postgres
  database: inventory_hub_test

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>